name: Release

# Manual run: build all exports and upload them as workflow artifacts.
# Tag push (v*): additionally publish a GitHub Release with the zipped builds.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a release mid-way; a second run for the same ref waits instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2"

# Third-party actions are pinned to commit SHAs (Dependabot updates them).
jobs:
  export:
    name: Export builds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      # The full .tpz is ~1.3 GB; we only keep the four templates we export with.
      - name: Cache export templates
        id: cache-templates
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}-win-linux-macos
      - name: Download export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -O "$base/$tpz" -O "$base/SHA512-SUMS.txt"
          grep " $tpz\$" SHA512-SUMS.txt | sha512sum -c -
          mkdir -p "$dest"
          unzip -q -j -o "$tpz" -d "$dest" \
            templates/version.txt \
            templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe \
            templates/macos.zip
          rm "$tpz"
          ls -la "$dest"

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Export
        run: |
          export_one() {  # preset, output path
            mkdir -p "$(dirname "$2")"
            ~/godot/godot --headless --path . --export-release "$1" "$2"
            test -s "$2" || { echo "::error::export of '$1' produced no $2"; exit 1; }
          }
          export_one "Windows Desktop" build/windows/Brandmauer.exe
          export_one "Linux"           build/linux/Brandmauer.x86_64
          export_one "macOS"           build/macos/Brandmauer.zip
          export_one "Linux Server"    build/server/BrandmauerServer.x86_64

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          chmod +x build/linux/Brandmauer.x86_64 build/server/BrandmauerServer.x86_64
          (cd build/windows && zip -q -r "$GITHUB_WORKSPACE/dist/Brandmauer-$version-windows.zip" .)
          (cd build/linux && zip -q -r "$GITHUB_WORKSPACE/dist/Brandmauer-$version-linux.zip" .)
          (cd build/server && zip -q -r "$GITHUB_WORKSPACE/dist/BrandmauerServer-$version-linux.zip" .)
          # The macOS export already is a zip containing Brandmauer.app.
          cp build/macos/Brandmauer.zip "dist/Brandmauer-$version-macos.zip"
          # Plain Windows exe (pck embedded) for testers: download and double-click.
          cp build/windows/Brandmauer.exe "dist/Brandmauer-$version-windows.exe"
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brandmauer-builds
          path: |
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
          compression-level: 0  # already zipped

  publish:
    name: Publish release
    needs: export
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (for .github/release-notes.md)
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: brandmauer-builds
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          [[ "$GITHUB_REF_NAME" == *-* ]] && extra+=(--prerelease)  # e.g. v0.2.0-beta
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Brandmauer $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            --generate-notes \
            --verify-tag \
            "${extra[@]}"
